<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Downloading Rajpatra PDF...</title>
</head>
<body>
    <h2 style="font-family: sans-serif; text-align: center; margin-top: 50px;">
        Downloading Gazette PDF... Please wait.
    </h2>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const batchNo = urlParams.get('batchNo');

        if (batchNo) {
            // Updated to match your EXACT folder name "Pdfs" (Capital P)
            const pdfUrl = `https://mahaaappverification.github.io/mahaonline.gov.in/Pdfs/${batchNo}.pdf`;

            const link = document.createElement('a');
            link.href = pdfUrl;
            link.download = `Rajpatra_Batch_${batchNo}.pdf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        } else {
            document.body.innerHTML = "<h3>Error: No Batch Number provided in link.</h3>";
        }
    </script>
</body>
</html>
